name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish self-contained single-file binary
        run: >
          dotnet publish
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:DebugType=embedded

      - name: Compute SHA256
        shell: pwsh
        run: |
          $exe = "bin/Release/net9.0-windows/win-x64/publish/dictation-shim.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          Set-Content -Path "$exe.sha256" -Value "$hash  dictation-shim.exe"
          Write-Host "SHA256: $hash"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/Release/net9.0-windows/win-x64/publish/dictation-shim.exe
            bin/Release/net9.0-windows/win-x64/publish/dictation-shim.exe.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload artefact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dictation-shim
          path: |
            bin/Release/net9.0-windows/win-x64/publish/dictation-shim.exe
            bin/Release/net9.0-windows/win-x64/publish/dictation-shim.exe.sha256
